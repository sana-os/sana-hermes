# Rebuild dist/ from the pinned SANA OS commit and check two things:
# 1. Hermes' own prompt-injection scanner finds nothing in any SOUL.md.
#    Why: a SOUL.md installed as part of a shared profile is blocked, not
#    just warned about, when it matches.
# 2. The committed dist/ is exactly what the sources produce.
#    Why: dist/ is what the model receives; a hand edit there, or a source
#    change committed without rebuilding, would make the diff history lie.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # build.py names, for each framework skill, the last commit that changed
      # its source file. That needs the submodule's history, not a shallow copy.
      # Fetch only when the copy is shallow, and fail if it still is: a failed
      # fetch must not pass silently (build.py also refuses a shallow copy).
      - name: Ensure full history for the SANA OS submodule
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git -C upstream/sana-os rev-parse --is-shallow-repository)" = "true" ]; then
            git -C upstream/sana-os fetch --unshallow
          fi
          test "$(git -C upstream/sana-os rev-parse --is-shallow-repository)" = "false"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # On a tag push, the tag must name the version the commit carries and
      # point at a merge commit on main. Why: v0.5.1 was first pushed on the
      # commit before the licence pull request, and the build check passed,
      # since that commit was consistent in itself.
      - name: Tag matches the version and main
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 check_release.py "${GITHUB_REF_NAME}" --ci

      # The scanner is fetched with an authenticated, sparse git checkout of the
      # pinned commit. Why: the first run fetched it from
      # raw.githubusercontent.com without authentication and got HTTP 429
      # (rate limit on shared runners). The commit hash pins the content.
      - name: Read the pinned Hermes scanner from sana-hermes.json
        id: scan
        shell: bash
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          s = json.load(open("sana-hermes.json"))["hermes_scan"]
          print("repository=" + s["repository"].removeprefix("https://github.com/"))
          print("commit=" + s["commit"])
          print("file=" + s["file"])
          EOF

      - name: Fetch the pinned Hermes scanner
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.scan.outputs.repository }}
          ref: ${{ steps.scan.outputs.commit }}
          path: .hermes-scan
          sparse-checkout: ${{ steps.scan.outputs.file }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Build both modes with the scan
        run: |
          python3 build.py --scan ".hermes-scan/${{ steps.scan.outputs.file }}"
          python3 build.py --mode inline --scan ".hermes-scan/${{ steps.scan.outputs.file }}"

      - name: Committed dist/ matches the sources
        run: |
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)" || {
            echo "::error::dist/ differs from what build.py produces. Rebuild and commit dist/."
            git diff --stat -- dist
            exit 1
          }
